steps:
  - script: |
      python3 -m venv $(Agent.TempDirectory)/bist_venv
      source $(Agent.TempDirectory)/bist_venv/bin/activate
      pip3 install -r $(ScriptDir)/run_bist_requirements.txt
      $(ScriptDir)/run_bist -t $(System.JobName)
      mv bist_results.xml bist_results_$(System.JobName).xml
      mv bist_results.json bist_results_$(System.JobName).json
    displayName: 'Run BIST'
    workingDirectory: $(Agent.BuildDirectory)
    continueOnError: true

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/bist_results_$(System.JobName).xml'
      testRunTitle: 'BIST results $(System.JobName)'
      searchFolder: '$(Agent.BuildDirectory)'

  - publish: $(Agent.BuildDirectory)/bist_results_$(System.JobName).json
    artifact: 'bist_results_$(System.JobName).json run $(System.JobAttempt)'
    displayName: 'Publish bist_results_$(System.JobName).json'
    continueOnError: true
