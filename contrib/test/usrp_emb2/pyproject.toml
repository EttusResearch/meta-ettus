[project]
name = "usrp-emb"

[tool.poetry]
name = "usrp-emb"
version = "0.1.0"
description = "USRP embedded tool"
authors = ["Joerg Hofrichter <joerg.hofrichter@ni.com>"]
license = "GPL-3.0-or-later"

[tool.poetry.dependencies]
python = "^3.8"
labgrid = ">=0.24"
pexpect = "^4.9.0"
pyserial = "^3.5"
py3tftp = "^1.3.0"
"ruamel.yaml" = "^0.18.6"
Mako = "^1.3.6"
pyroute2 = "^0.8.1"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
usrp-emb-update = "usrp_emb.update:main"
