#@TYPE: Machine
#@NAME: ni-titanium-xlnx
#@DESCRIPTION: Machine configuration for NI Titanium (X4XX MB).

#### Preamble
MACHINEOVERRIDES =. "${@['', 'ni-titanium:']['ni-titanium' !='${MACHINE}']}"
#### Regular settings follow

# Yocto device-tree variables
YAML_CONSOLE_DEVICE_CONFIG:pn-device-tree ?= "psu_uart_1"
YAML_MAIN_MEMORY_CONFIG:pn-device-tree ?= "psu_ddr_0"
DT_PADDING_SIZE:pn-device-tree ?= "0x1000"
DTC_FLAGS:pn-device-tree ?= ""

# Yocto u-boot-xlnx variables
UBOOT_MACHINE ?= "xilinx_zynqmp_virt_defconfig"

# Use uart 1 for XSCT based software (pmu-firmware, fsbl-firmware, ...)
YAML_SERIAL_CONSOLE_STDIN ?= "psu_uart_1"
YAML_SERIAL_CONSOLE_STDOUT ?= "psu_uart_1"

# Serial Console Settings
SERIAL_CONSOLES ?= "115200;ttyPS0"
YAML_SERIAL_CONSOLE_BAUDRATE ?= "115200"

# Yocto arm-trusted-firmware(TF-A) variables
TFA_CONSOLE ?= "cadence1"
TFA_BL33_LOAD ?= "0x8000000"

# Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR ?= "0x0"
SKIP_APPEND_BASEADDR ?= "0"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT  ?= "0x200000"
UBOOT_LOADADDRESS ?= "0x200000"

# TODO: Check if any MACHINE_FEATURES need to be added
# Yocto MACHINE_FEATURES Variable
# MACHINE_FEATURES += "rfsoc"

# TODO: adopt for NI Titanium
# QB_MEM = "-m 4G"
# QEMU_HW_DTB_PS = "${QEMU_HW_DTB_PATH}/zcu102-arm.dtb"
# QEMU_HW_DTB_PMU = "${QEMU_HW_DTB_PATH}/zynqmp-pmu.dtb"

MACHINE_FEATURES_BACKFILL_CONSIDERED = "qemu-usermode"

# Required generic machine inclusion
require conf/machine/zynqmp-generic.conf

# This is an 'XSCT' based BSP
XILINX_XSCT_VERSION = "2025.1"
XILINX_WITH_ESW = "xsct"

# Note: variables HDF_BASE and HDF_PATH is defined in the external-hdf bbappend file

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' ni-titanium']['ni-titanium' != '${MACHINE}']}"

PREFERRED_PROVIDER_virtual/boot-bin = "xilinx-bootbin"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"

PREFERRED_PROVIDER_u-boot-tools = "u-boot-tools"
PREFERRED_PROVIDER_u-boot-tools-native = "u-boot-tools-native"


UBOOT_SUFFIX:zynqmp ?= "itb"
UBOOT_BINARY ?= "u-boot.${UBOOT_SUFFIX}"
UBOOT_ELF:aarch64 ?= "u-boot.elf"
UBOOT_MACHINE = "ni_x410_rev5_defconfig"

BIF_COMMON_ATTR="${@'auth_params pskfile sskfile' if d.getVar('BOOTGEN_KEYS_PATH') else ''}"
BIF_COMMON_ATTR[auth_params] ?= "ppk_select = 0; spk_id=0x00000000"
BIF_COMMON_ATTR[pskfile] ?= "psk0.pem"
BIF_COMMON_ATTR[sskfile] ?= "ssk0.pem"
BIF_AUTHENTICATION ?= "${@',authentication=rsa' if d.getVar('BOOTGEN_KEYS_PATH') else ''}"

BIF_PARTITION_ATTR ?= "fsbl pmufw arm-trusted-firmware device-tree u-boot"
BIF_PARTITION_ATTR[fsbl] ?= "bootloader,destination_cpu=a53-0${BIF_AUTHENTICATION}"
BIF_PARTITION_ATTR[pmufw] ?= "destination_cpu=pmu${BIF_AUTHENTICATION}"
BIF_PARTITION_ATTR[arm-trusted-firmware] ?= "destination_cpu=a53-0, exception_level=el-3,trustzone${BIF_AUTHENTICATION}"
BIF_PARTITION_ATTR[device-tree] ?= "destination_cpu=a53-0, load=0x100000${BIF_AUTHENTICATION}"
BIF_PARTITION_ATTR[u-boot] ?= "destination_cpu=a53-0, exception_level=el-1${BIF_AUTHENTICATION}"
BIF_PARTITION_IMAGE[u-boot] ?= "${RECIPE_SYSROOT}/uboot/u-boot.elf"

# TODO: revisit DTB handling
IMAGE_BOOT_FILES:remove = "system.dtb"
# Image is appended by conf/machine/zynqmp-generic.conf
IMAGE_BOOT_FILES:remove = "Image"
IMAGE_BOOT_FILES += " fitImage"

# TODO: revisit boot script handling
# UBOOT_BOOT_SCRIPT = ""

# Consume u-boot instead of u-boot-xlnx in xilinx-bootbin recipe
BIF_SSBL_ATTR = "u-boot"
