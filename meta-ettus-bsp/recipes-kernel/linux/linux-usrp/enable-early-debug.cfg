# Enable early boot debugging (without bloating kernel size)
# Optimized for post-mortem log buffer analysis via memory dump
# CONFIG_DEBUG_KERNEL is not set
# CONFIG_DEBUG_INFO is not set
CONFIG_EARLY_PRINTK=y

# Increase log buffer to 1MB to capture boot messages without bloating kernel
CONFIG_LOG_BUF_SHIFT=20
CONFIG_LOG_CPU_MAX_BUF_SHIFT=16
# Ensure printk doesn't get rate-limited
CONFIG_PRINTK_TIME=y
# CONFIG_PRINTK_CALLER is not set
# Serial console debugging
CONFIG_SERIAL_EARLYCON=y
CONFIG_SERIAL_CORE_CONSOLE=y
# Help identify locking issues that cause hangs
CONFIG_DETECT_HUNG_TASK=y
CONFIG_DEFAULT_HUNG_TASK_TIMEOUT=120