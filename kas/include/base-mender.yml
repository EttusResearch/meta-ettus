header:
  version: 10
distro: Alchemy
target:
  - gnuradio-image
env:
  MENDER_ARTIFACT_NAME: git
local_conf_header:
  mender: |
    INHERIT += "mender-full"
    PREFERRED_PROVIDER_mender = "mender-client"
  licenses: |
    COPY_LIC_MANIFEST = "1"
    COPY_LIC_DIRS = "1"
  # externalsrc: |
  #   INHERIT += "externalsrc"
  #   EXTERNALSRC:pn-uhd = "/work/uhd/host"
  #   EXTERNALSRC:pn-mpmd = "/work/uhd/mpm"
  #   EXTERNALSRC:pn-uhd-fpga-images = "/work/fpga"
