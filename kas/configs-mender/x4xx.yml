header:
  version: 10
  includes:
    - kas/include/base-mender.yml
    - kas/include/meta-stm32.yml
machine: ni-titanium-rev5-mender
env:
  MENDER_ARTIFACT_NAME: git_x4xx
target:
  # - mc:zynqmp-pmu:pmu-firmware
  - mc:ni-titanium-ec:chromium-ec
  - mc:ni-titanium:gnuradio-image
local_conf_header:
  "SDK deploy directory": |
    SDK_DEPLOY:append = "/x4xx"
  "no FEATURE_C12 in ext4 images": |
    EXTRA_IMAGECMD:ext4 = "-i 4096 -O ^orphan_file"
    MENDER_DATA_PART_FSOPTS = "-i 4096 -O ^orphan_file"
repos:
  meta-ettus:
    layers:
      meta-titanium:
      meta-mender-titanium:
  meta-openamp:
    url: https://github.com/Xilinx/meta-openamp
    commit: e44e4a3b4abe9cc5fdfe75c43181ba82750f6865
  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    commit: a81c19915b5b9e71ed394032e9a50fd06919e1cd # tag: yocto-5.0.3
    layers:
      meta-arm:
      meta-arm-toolchain:
  meta-xilinx:
    url: https://github.com/Xilinx/meta-xilinx
    commit: f24f5dde78fe9a8a30d56f0ee6699bed29f21bcf # tag: xlnx-rel-v2025.1
    layers:
      meta-xilinx-core:
      meta-xilinx-bsp:
      meta-xilinx-standalone:
  meta-xilinx-tools:
    url: https://github.com/Xilinx/meta-xilinx-tools
    commit: 982572c8efe0070b198ed162c0a3f268b4a15d4a # tag: xlnx-rel-v2025.1
