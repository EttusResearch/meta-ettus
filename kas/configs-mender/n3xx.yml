header:
  version: 10
  includes:
    - kas/include/base-mender.yml
    - kas/include/meta-stm32.yml
machine: ni-sulfur-rev11-mender
target:
  - mc:ni-sulfur-ec:chromium-ec
  - mc:ni-sulfur:gnuradio-image
env:
  MENDER_ARTIFACT_NAME: git_n3xx
local_conf_header:
  "SDK deploy directory": |
    SDK_DEPLOY:append = "/n3xx"
  "no FEATURE_C12 in ext4 images": |
    EXTRA_IMAGECMD:ext4 = "-i 4096 -O ^orphan_file"
    MENDER_DATA_PART_FSOPTS = "-i 4096 -O ^orphan_file"
repos:
  meta-ettus:
    layers:
      meta-sulfur:
      meta-mender-sulfur:
