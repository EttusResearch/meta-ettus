header:
  version: 10
  includes:
    - kas/include/base-mender.yml
    - kas/include/meta-stm32.yml
machine: ni-neon-rev2-mender
target:
  - mc:ni-neon:gnuradio-image
  - mc:ni-neon-ec:chromium-ec
env:
  MENDER_ARTIFACT_NAME: git_e320
local_conf_header:
  "SDK deploy directory": |
    SDK_DEPLOY:append = "/e320"
  "no FEATURE_C12 in ext4 images": |
    EXTRA_IMAGECMD:ext4 = "-i 4096 -O ^orphan_file"
    MENDER_DATA_PART_FSOPTS = "-i 4096 -O ^orphan_file"
repos:
  meta-ettus:
    layers:
      meta-neon:
      meta-mender-neon:
